services:
  db:
    image: postgres:15-alpine
    container_name: yt-downloader-db
    environment:
      POSTGRES_DB: youtube_downloader
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - yt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: yt-downloader-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/youtube_downloader
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    volumes:
      - downloads:/app/downloads
    networks:
      - yt-network

  frontend:
    build: ./frontend
    container_name: yt-downloader-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - yt-network

volumes:
  postgres_data:
  downloads:

networks:
  yt-network:
    driver: bridge